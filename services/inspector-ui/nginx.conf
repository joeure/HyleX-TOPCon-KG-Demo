worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Resolve the gateway through Docker's embedded DNS on a short interval
        # instead of caching its IP once at startup. Without this, recreating
        # the ui-gateway container (which takes a new 172.20.0.x address) strands
        # this proxy on a dead IP and every /auth/ and /inspector/ call 502s
        # until the container is restarted. Pairs with the variable upstream
        # below (a literal proxy_pass host is resolved only at startup).
        resolver 127.0.0.11 valid=10s ipv6=off;

        location /auth/ {
            set $ui_gateway gateway:8080;
            proxy_pass http://$ui_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
        }

        location /inspector/ {
            set $ui_gateway gateway:8080;
            proxy_pass http://$ui_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
            # A bounded-agent query runs several LLM round-trips and can take a
            # couple of minutes. nginx's default 60s proxy_read_timeout returned
            # a spurious 504 mid-answer; match the ui-gateway's own 900s ceiling.
            proxy_connect_timeout 10s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
        }

        # Static, content-hashed assets can be cached aggressively.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # SPA: always fall back to index.html for client-side routes.
        location / {
            try_files $uri /index.html;
        }
    }
}
